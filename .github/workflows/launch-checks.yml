name: Public Service Passport launch checks

on:
  pull_request:
  push:
    branches:
      - feat/benefit-bridge-webmcp
      - feat/v1-openproof-citizen

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned test dependencies
        run: npm install --ignore-scripts
      - name: Deterministic, golden and adversarial tests
        run: npm run check
      - name: Run 100-case authority pilot
        run: npm run pilot
      - name: Syntax checks
        run: |
          node --check public/app.js
          node --check public/packet-core.js
          node --check public/v03.js
          node --check public/v03-simulator.js
          node --check public/v1.js
          node --check public/openproof-verifier.js
          node --check public/citizen-case-handoff.js
          node --check public/v1-handoff.js
          node --check public/authority-core.js
          node --check public/authority.js
          node --check public/authority-handoff.js
          node --check public/pilot-core.js
          node --check public/pilot.js
          node --check scripts/run-authority-pilot.mjs
          node --check tests/browser-v1.mjs
          node --check tests/browser-journey.mjs
          node --check netlify/functions/evaluate.mjs
      - name: Authority-boundary guard
        shell: bash
        run: |
          if grep -RniE "submit_application|sign_application|authenticate_as_user|upload_to_authority" public --include='*.js'; then
            echo "Consequential authority tool identifier detected."
            exit 1
          fi
          echo "No submit/sign/authenticate/upload-to-authority tool identifiers detected."
      - name: Public trust-language guard
        shell: bash
        run: |
          grep -q "Ihre aktuellen Werte sind selbst angegeben" public/v1.html
          grep -q "Infrastruktur-Evidence, nicht ein Nachweis über Sie" public/v1.html
          grep -q "Kein Anspruchsbescheid" public/v1.html
          grep -q "Diesen Testfall aus Behördensicht ansehen" public/v1.html
          grep -q "SYNTHETISCHE SANDBOX" public/authority.html
          grep -q "Kein gemessener Behördenbetrieb" public/pilot.html
          grep -q "Authority Preview is not submission" CONTEXT.md
          echo "Citizen and authority trust boundaries are visible."
      - name: Install Chromium for release browser QA
        run: npx playwright install --with-deps chromium
      - name: Desktop + 390px mobile release browser QA
        shell: bash
        run: |
          node scripts/dev-server.mjs >/tmp/psp-v1-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8888/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/psp-v1-server.log
            exit 1
          fi
          npm run test:browser
          npm run test:journey
