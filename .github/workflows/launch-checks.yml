name: Benefit Bridge launch checks

on:
  pull_request:
  push:
    branches:
      - feat/benefit-bridge-webmcp

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deterministic tests and smoke
        run: npm run check
      - name: Run 100-case authority pilot
        run: npm run pilot
      - name: Syntax checks
        run: |
          node --check public/app.js
          node --check public/packet-core.js
          node --check public/v03.js
          node --check public/v03-simulator.js
          node --check public/authority-core.js
          node --check public/authority.js
          node --check public/pilot-core.js
          node --check public/pilot.js
          node --check scripts/run-authority-pilot.mjs
          node --check netlify/functions/evaluate.mjs
      - name: Authority-boundary guard
        shell: bash
        run: |
          if grep -RniE "submit_application|sign_application|authenticate_as_user|upload_to_authority" public --include='*.js'; then
            echo "Consequential authority tool identifier detected."
            exit 1
          fi
          echo "No submit/sign/authenticate/upload-to-authority tool identifiers detected."
