name: Citizen clarity visual QA

on:
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start exact PR build
        run: |
          node scripts/dev-server.mjs > dev-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8888/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8888/ -o /dev/null
      - name: Browser readability assertions and screenshots
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          npm install --no-save --no-package-lock puppeteer-core@latest >/dev/null 2>&1
          CHROME="$CHROME" node - <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          (async () => {
            const browser = await puppeteer.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox','--disable-gpu'] });
            for (const config of [
              { name: 'desktop', width: 1440, height: 1000, minEvidenceWidth: 300 },
              { name: 'mobile', width: 390, height: 844, minEvidenceWidth: 210 }
            ]) {
              const page = await browser.newPage();
              await page.setViewport({ width: config.width, height: config.height, deviceScaleFactor: 1 });
              await page.goto('http://127.0.0.1:8888/', { waitUntil: 'networkidle0' });
              await page.click('#evaluate-button');
              await page.waitForFunction(() => !document.querySelector('#passport-panel')?.classList.contains('hidden'));
              await page.waitForFunction(() => document.querySelector('.evidence-item .evidence-copy'));
              const metrics = await page.evaluate(() => {
                const copy = document.querySelector('.evidence-item .evidence-copy');
                const item = document.querySelector('.evidence-item');
                const appInput = document.querySelector('.citizen-application input');
                const explainer = document.querySelector('.agent-explainer');
                return {
                  evidenceWidth: copy?.getBoundingClientRect().width || 0,
                  evidenceItemWidth: item?.getBoundingClientRect().width || 0,
                  evidenceFont: parseFloat(getComputedStyle(copy?.querySelector('strong')).fontSize || '0'),
                  appInputFont: appInput ? parseFloat(getComputedStyle(appInput).fontSize) : 0,
                  explainerText: explainer?.innerText || '',
                  horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });
              console.log(config.name, metrics);
              assert(metrics.evidenceWidth >= config.minEvidenceWidth, `${config.name}: evidence text still collapsed (${metrics.evidenceWidth}px)`);
              assert(metrics.evidenceFont >= 14, `${config.name}: evidence font too small (${metrics.evidenceFont}px)`);
              assert(metrics.appInputFont >= 14, `${config.name}: application input font too small (${metrics.appInputFont}px)`);
              assert(metrics.explainerText.includes('Die Seite funktioniert für Sie'), `${config.name}: plain-language agent explainer missing`);
              assert(metrics.explainerText.includes('0 Werkzeuge zum Absenden'), `${config.name}: authority boundary not clear`);
              assert(!metrics.horizontalOverflow, `${config.name}: page has horizontal overflow`);
              await page.screenshot({ path: `${config.name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: citizen-clarity-screenshots
          path: |
            desktop.png
            mobile.png
            dev-server.log
