name: Visual preview QA

on:
  pull_request:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start exact PR build locally
        shell: bash
        run: |
          node scripts/dev-server.mjs > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8888/ -o preview.html; then break; fi
            sleep 1
          done
          test -s preview.html
          grep -q "Welche Unterstützung könnte Ihrer Familie zustehen" preview.html
          grep -q "So funktioniert es" preview.html
          grep -qi "DAS PROBLEM" preview.html
          grep -q "Technische Details & WebMCP-Nachweis" preview.html
      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1440,1000 --screenshot=desktop.png http://127.0.0.1:8888/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=390,844 --screenshot=mobile.png http://127.0.0.1:8888/
          test -s desktop.png
          test -s mobile.png
      - name: Smoke browser-loaded DOM
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8888/ > rendered.html
          grep -q "Unterstützung prüfen" rendered.html
          grep -q "WebMCP" rendered.html
      - uses: actions/upload-artifact@v4
        with:
          name: citizen-preview-screenshots
          path: |
            desktop.png
            mobile.png
            preview.html
            rendered.html
            dev-server.log
