name: Final live production acceptance

on:
  pull_request:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for citizen production deploy
        shell: bash
        run: |
          URL="https://public-service-passport.netlify.app"
          echo "URL=$URL" >> "$GITHUB_ENV"
          rm -f page.html headers.txt
          for i in {1..40}; do
            if curl -fsS -D headers.txt "$URL" -o page.html && grep -q "Welche Unterstützung könnte Ihrer Familie zustehen" page.html; then
              echo "Citizen production is live."
              break
            fi
            sleep 5
          done
          grep -q "Welche Unterstützung könnte Ihrer Familie zustehen" page.html
          grep -q "So funktioniert es" page.html
          grep -q "Technische Details & WebMCP-Nachweis" page.html
          grep -qi '^content-security-policy:.*script-src.*self' headers.txt
          grep -qi '^x-frame-options: *DENY' headers.txt
          grep -qi '^x-content-type-options: *nosniff' headers.txt
          # Our source intentionally contains no inline executable scripts; CSP may
          # block host/browser-injected inline code without affecting the product.
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html','utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>/gi)].map(m => m[0]);
          if (!scripts.length || scripts.some(tag => !/\bsrc=/.test(tag))) throw new Error('Unexpected inline product script');
          NODE
      - name: Exercise real production API
        shell: bash
        run: |
          cat > household.json <<'JSON'
          {"household":{"adults":1,"singleParent":true,"children":[{"age":7},{"age":12}],"monthlyGrossIncome":2000,"warmRent":1100,"receivesKindergeld":true,"city":"Berlin"}}
          JSON
          curl -fsS -H 'content-type: application/json' --data-binary @household.json "$URL/api/evaluate" -o result.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('result.json','utf8'));
          if (!r.ok) throw new Error('Berlin production result not ok');
          if (r.summary.knownMonthly !== 518) throw new Error(`knownMonthly ${r.summary.knownMonthly}`);
          if (r.summary.potentialAdditionalMax !== 594) throw new Error(`potentialAdditionalMax ${r.summary.potentialAdditionalMax}`);
          if (r.benefits.find(x=>x.id==='wohngeld').monthlyAmount !== null) throw new Error('Wohngeld amount must remain unguessed');
          if (!r.boundary.includes('keine Behördenentscheidung')) throw new Error('Citizen boundary missing');
          console.log(r.summary.headline, r.traceId);
          NODE

          CODE=$(curl -sS -o hamburg.json -w '%{http_code}' -H 'content-type: application/json' --data '{"household":{"adults":1,"children":[{"age":7}],"monthlyGrossIncome":1600,"warmRent":900,"receivesKindergeld":true,"city":"Hamburg"}}' "$URL/api/evaluate")
          test "$CODE" = "400"
          grep -q 'aktuell nur Berlin' hamburg.json

          CODE=$(curl -sS -o wrong-type.json -w '%{http_code}' -H 'content-type: text/plain' --data '{}' "$URL/api/evaluate")
          test "$CODE" = "415"

          python3 - <<'PY'
          import json
          with open('oversize.json','w') as f:
              json.dump({'household': {'adults':1,'children':[{'age':7}],'monthlyGrossIncome':1600,'warmRent':900,'receivesKindergeld':True,'city':'Berlin'}, 'padding':'x'*40000}, f)
          PY
          CODE=$(curl -sS -o oversize-response.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @oversize.json "$URL/api/evaluate")
          test "$CODE" = "413"
      - name: Exercise real citizen flow in deployed browser
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --version
          npm install --no-save --no-package-lock puppeteer-core@latest >/dev/null 2>&1
          CHROME="$CHROME" node - <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox','--disable-gpu'] });
            const page = await browser.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push({ text: msg.text(), location: msg.location() }); });
            page.on('pageerror', err => pageErrors.push(err.message));
            const response = await page.goto(process.env.URL, { waitUntil: 'networkidle2', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`page status ${response?.status()}`);
            await new Promise(r => setTimeout(r, 1200));
            const initial = await page.evaluate(() => ({
              h1: document.querySelector('h1')?.textContent.trim(),
              childRows: document.querySelectorAll('.child-row').length,
              studio: Boolean(document.querySelector('#application-studio')),
              webStatus: document.querySelector('#webmcp-status')?.textContent.trim(),
              formButton: document.querySelector('#evaluate-button')?.textContent.trim()
            }));
            console.log('initial', initial);
            if (!initial.h1?.includes('Welche Unterstützung')) throw new Error('citizen H1 missing');
            if (initial.childRows !== 2) throw new Error(`expected 2 child rows, got ${initial.childRows}`);
            if (!initial.studio) throw new Error('Application Studio module did not execute');
            if (!initial.formButton?.includes('Unterstützung prüfen')) throw new Error('citizen CTA missing');
            if (!initial.webStatus?.includes('11 read-only tools')) throw new Error(`WebMCP status incomplete: ${initial.webStatus}`);

            await page.click('#evaluate-button');
            await page.waitForFunction(() => !document.querySelector('#result-content')?.classList.contains('hidden'), { timeout: 15000 });
            await new Promise(r => setTimeout(r, 500));
            const result = await page.evaluate(() => ({
              headline: document.querySelector('#summary-headline')?.textContent.trim(),
              passportVisible: !document.querySelector('#passport-panel')?.classList.contains('hidden'),
              applicationVisible: !document.querySelector('#application-studio')?.classList.contains('hidden'),
              webStatus: document.querySelector('#webmcp-status')?.textContent.trim()
            }));
            console.log('after submit', result);
            if (!result.headline?.includes('€518/Monat')) throw new Error(`unexpected citizen result: ${result.headline}`);
            if (!result.passportVisible) throw new Error('passport did not become visible');
            if (!result.applicationVisible) throw new Error('application studio did not become visible');

            // Fail on actual page exceptions or errors originating from our JS/modules.
            // Keep strict CSP: blocked injected inline code is expected security behavior.
            const productErrors = consoleErrors.filter(entry =>
              /app\.js|v03\.js|packet-core\.js|safe-html\.js|Failed to load module script|Uncaught/i.test(`${entry.text} ${entry.location?.url || ''}`)
            );
            console.log('pageErrors', pageErrors);
            console.log('consoleErrors', consoleErrors);
            if (pageErrors.length || productErrors.length) throw new Error('product browser runtime errors detected');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
